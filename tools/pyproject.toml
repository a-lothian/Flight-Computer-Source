[project]
name = "flight-log-tools"
version = "0.1.0"
description = "PC-side tools for the flight computer: collect the NAND log over SWO as CSV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyelftools>=0.33",
]

[project.scripts]
capture-log = "flight_log_tools.capture_log:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"
